# LacyLights GraphQL Schema
# This is the primary schema for the LacyLights backend

# =============================================================================
# ENUMS
# =============================================================================

enum FixtureType {
  LED_PAR
  MOVING_HEAD
  STROBE
  DIMMER
  OTHER
}

enum ChannelType {
  INTENSITY
  RED
  GREEN
  BLUE
  WHITE
  AMBER
  UV
  CYAN
  MAGENTA
  YELLOW
  LIME
  INDIGO
  COLD_WHITE
  WARM_WHITE
  PAN
  TILT
  ZOOM
  FOCUS
  IRIS
  GOBO
  COLOR_WHEEL
  EFFECT
  STROBE
  MACRO
  OTHER
}

enum UserRole {
  ADMIN
  USER
}

enum ProjectRole {
  OWNER
  EDITOR
  VIEWER
}

enum EasingType {
  LINEAR
  EASE_IN_OUT_CUBIC
  EASE_IN_OUT_SINE
  EASE_OUT_EXPONENTIAL
  BEZIER
  S_CURVE
}

"""
Determines how a channel behaves during look transitions.
FADE - Interpolate smoothly between values (default for intensity, colors)
SNAP - Jump to target value at start of transition (for gobos, macros, effects)
SNAP_END - Jump to target value at end of transition
"""
enum FadeBehavior {
  FADE
  SNAP
  SNAP_END
}

enum LookSortField {
  NAME
  CREATED_AT
  UPDATED_AT
}

enum DifferenceType {
  VALUES_CHANGED
  ONLY_IN_LOOK1
  ONLY_IN_LOOK2
}

enum WiFiSecurityType {
  OPEN
  WEP
  WPA_PSK
  WPA_EAP
  WPA3_PSK
  WPA3_EAP
  OWE
}

"""
Phases of the OFL import process
"""
enum OFLImportPhase {
  IDLE
  DOWNLOADING
  EXTRACTING
  PARSING
  IMPORTING
  COMPLETE
  FAILED
  CANCELLED
}

"""
Type of fixture change detected during OFL update check
"""
enum OFLFixtureChangeType {
  NEW
  UPDATED
  UNCHANGED
}

enum ImportMode {
  CREATE
  MERGE
}

enum FixtureConflictStrategy {
  SKIP
  REPLACE
  ERROR
}

enum CueListDataChangeType {
  CUE_ADDED
  CUE_UPDATED
  CUE_REMOVED
  CUE_REORDERED
  CUE_LIST_METADATA_CHANGED
  LOOK_NAME_CHANGED
}

"Payload for cue list data change notifications"
type CueListDataChangedPayload {
  cueListId: ID!
  changeType: CueListDataChangeType!
  "Affected cue IDs (for cue changes)"
  affectedCueIds: [ID!]
  "Affected look ID (for look name changes)"
  affectedLookId: ID
  "New look name if this is a LOOK_NAME_CHANGED event"
  newLookName: String
  "Timestamp of the change"
  timestamp: String!
}

# =============================================================================
# CORE TYPES
# =============================================================================

type Project {
  id: ID!
  name: String!
  description: String
  fixtureCount: Int!
  lookCount: Int!
  cueListCount: Int!
  createdAt: String!
  updatedAt: String!
  fixtures: [FixtureInstance!]!
  looks: [Look!]!
  cueLists: [CueList!]!
  lookBoards: [LookBoard!]!
  users: [ProjectUser!]!

  # 2D Layout Canvas Configuration (for fixture layout editor)
  layoutCanvasWidth: Int!
  layoutCanvasHeight: Int!
}

type FixtureDefinition {
  id: ID!
  manufacturer: String!
  model: String!
  type: FixtureType!
  channels: [ChannelDefinition!]!
  modes: [FixtureMode!]!
  isBuiltIn: Boolean!
  createdAt: String!
}

type FixtureMode {
  id: ID!
  name: String!
  shortName: String
  channelCount: Int!
  channels: [ModeChannel!]!
}

type ModeChannel {
  id: ID!
  offset: Int!
  channel: ChannelDefinition!
}

type ChannelDefinition {
  id: ID!
  name: String!
  type: ChannelType!
  offset: Int!
  minValue: Int!
  maxValue: Int!
  defaultValue: Int!
  fadeBehavior: FadeBehavior!
  isDiscrete: Boolean!
}

type FixtureInstance {
  id: ID!
  name: String!
  description: String

  # Fixture Definition Info (flattened)
  definitionId: ID!
  manufacturer: String!
  model: String!
  type: FixtureType!

  # Mode Info (flattened)
  modeName: String!
  channelCount: Int!
  channels: [InstanceChannel!]!

  # DMX Configuration
  project: Project!
  universe: Int!
  startChannel: Int!
  tags: [String!]!
  projectOrder: Int

  # 2D Layout Position.
  # These fields are exposed in query responses as pixel coordinates
  # (0 to project canvasWidth/Height). During the migration period,
  # stored values may still be in normalized 0-1 coordinates, but are
  # transparently converted to pixels in API responses for backward
  # compatibility. New values should always be provided in pixels.
  layoutX: Float
  layoutY: Float
  layoutRotation: Float

  createdAt: String!
}

type InstanceChannel {
  id: ID!
  offset: Int!
  name: String!
  type: ChannelType!
  minValue: Int!
  maxValue: Int!
  defaultValue: Int!
  fadeBehavior: FadeBehavior!
  isDiscrete: Boolean!
}

type Look {
  id: ID!
  name: String!
  description: String
  project: Project!
  fixtureValues: [FixtureValue!]!
  createdAt: String!
  updatedAt: String!
}

type ChannelValue {
  offset: Int!
  value: Int!
}

type FixtureValue {
  id: ID!
  fixture: FixtureInstance!
  channels: [ChannelValue!]!
  lookOrder: Int
}

type LookBoard {
  id: ID!
  name: String!
  description: String
  project: Project!
  defaultFadeTime: Float!
  gridSize: Int
  canvasWidth: Int!
  canvasHeight: Int!
  buttons: [LookBoardButton!]!
  createdAt: String!
  updatedAt: String!
}

type LookBoardButton {
  id: ID!
  lookBoard: LookBoard!
  look: Look!
  layoutX: Int!
  layoutY: Int!
  width: Int
  height: Int
  color: String
  label: String
  createdAt: String!
  updatedAt: String!
}

type CueList {
  id: ID!
  name: String!
  description: String
  loop: Boolean!
  project: Project!
  cues: [Cue!]!
  cueCount: Int!
  totalDuration: Float!
  createdAt: String!
  updatedAt: String!
}

type Cue {
  id: ID!
  name: String!
  cueNumber: Float!
  look: Look!
  cueList: CueList!
  fadeInTime: Float!
  fadeOutTime: Float!
  followTime: Float
  easingType: EasingType
  notes: String
  "When true, this cue is skipped during playback but remains visible in the UI"
  skip: Boolean!
}

type CueListPlaybackStatus {
  cueListId: ID!
  currentCueIndex: Int
  "True when a look's values are currently active on DMX fixtures (stays true after fade completes until stopped)"
  isPlaying: Boolean!
  "True when the cue list is paused (look activated outside cue context, cue index preserved)"
  isPaused: Boolean!
  "True when a fade-in transition is in progress"
  isFading: Boolean!
  currentCue: Cue
  nextCue: Cue
  previousCue: Cue
  fadeProgress: Float
  lastUpdated: String!
}

"Global playback status - returns which cue list is currently playing or paused (if any)"
type GlobalPlaybackStatus {
  "True if any cue list is currently playing"
  isPlaying: Boolean!
  "True if a cue list is paused (look activated outside cue context)"
  isPaused: Boolean!
  "True if a fade transition is in progress"
  isFading: Boolean!
  "ID of the currently playing cue list (null if not playing)"
  cueListId: ID
  "Name of the currently playing cue list (null if not playing)"
  cueListName: String
  "Current cue index in the playing cue list (null if not playing)"
  currentCueIndex: Int
  "Total number of cues in the playing cue list (null if not playing)"
  cueCount: Int
  "Name of the currently playing cue (null if not playing)"
  currentCueName: String
  "Fade progress percentage (0-100)"
  fadeProgress: Float
  lastUpdated: String!
}

type User {
  id: ID!
  email: String!
  name: String
  role: UserRole!
  createdAt: String!
}

type ProjectUser {
  id: ID!
  user: User!
  project: Project!
  role: ProjectRole!
  joinedAt: String!
}

type PreviewSession {
  id: ID!
  project: Project!
  user: User!
  isActive: Boolean!
  createdAt: String!
  dmxOutput: [UniverseOutput!]!
}

type UniverseOutput {
  universe: Int!
  channels: [Int!]!
}

type Setting {
  id: ID!
  key: String!
  value: String!
  createdAt: String!
  updatedAt: String!
}

type SystemInfo {
  artnetBroadcastAddress: String!
  artnetEnabled: Boolean!
  fadeUpdateRateHz: Int!
}

type ArtNetStatus {
  enabled: Boolean!
  broadcastAddress: String!
}

# =============================================================================
