# =============================================================================
# QUERIES
# =============================================================================

type Query {
  # Authentication
  "Get the currently authenticated user (null if not authenticated)"
  me: AuthUser
  "Check if authentication is enabled"
  authEnabled: Boolean!
  "Get global authentication settings (admin only when auth enabled)"
  authSettings: AuthSettings!
  "Check if a device is authorized by fingerprint"
  checkDeviceAuthorization(fingerprint: String!): DeviceAuthStatus!
  "Check device status by fingerprint (unauthenticated, for registration flow)"
  checkDevice(fingerprint: String!): DeviceCheckResult!
  "Get the current user's active sessions"
  mySessions: [Session!]!

  # User Management (admin only)
  "List all users (admin only)"
  users(page: Int = 1, perPage: Int = 50): [User!]!
  "Get a user by ID (admin only)"
  user(id: ID!): User
  "List all user groups (admin only)"
  userGroups: [UserGroup!]!
  "Get a user group by ID (admin only)"
  userGroup(id: ID!): UserGroup
  "List all devices, optionally filtered by status (admin only)"
  devices(status: DeviceStatus): [Device!]!
  "Get devices pending approval (admin only)"
  pendingDevices: [Device!]!
  "Get a device by ID (admin only)"
  device(id: ID!): Device

  # Groups
  "Get groups the current user belongs to"
  myGroups: [UserGroup!]!
  "Get pending invitations for the current user"
  myInvitations: [GroupInvitation!]!
  "Get invitations for a group (group admin or system admin)"
  groupInvitations(groupId: ID!): [GroupInvitation!]!

  # Projects
  projects: [Project!]!
  project(id: ID!): Project
  deletedProjects: [Project!]!  # Returns soft-deleted projects that can be restored

  # Fixtures
  fixtureDefinitions(filter: FixtureDefinitionFilter): [FixtureDefinition!]!
  fixtureDefinition(id: ID!): FixtureDefinition
  fixtureInstances(
    projectId: ID!
    page: Int = 1
    perPage: Int = 50
    filter: FixtureFilterInput
  ): FixtureInstancePage!
  fixtureInstance(id: ID!): FixtureInstance

  # Search Queries
  searchFixtures(
    projectId: ID!
    query: String!
    filter: FixtureFilterInput
    page: Int = 1
    perPage: Int = 50
  ): FixtureInstancePage!

  # DMX Channel Assignment
  channelMap(projectId: ID!, universe: Int): ChannelMapResult!
  suggestChannelAssignment(input: ChannelAssignmentInput!): ChannelAssignmentSuggestion!

  # Looks
  looks(
    projectId: ID!
    page: Int = 1
    perPage: Int = 50
    filter: LookFilterInput
    sortBy: LookSortField = CREATED_AT
  ): LookPage!
  look(id: ID!, includeFixtureValues: Boolean = true): Look
  lookFixtures(lookId: ID!): [LookFixtureSummary!]!

  searchLooks(
    projectId: ID!
    query: String!
    filter: LookFilterInput
    page: Int = 1
    perPage: Int = 50
  ): LookPage!

  # Look Boards
  lookBoards(projectId: ID!): [LookBoard!]!
  lookBoard(id: ID!): LookBoard
  lookBoardButton(id: ID!): LookBoardButton

  # Relationship Queries
  fixtureUsage(fixtureId: ID!): FixtureUsage!
  lookUsage(lookId: ID!): LookUsage!
  compareLooks(lookId1: ID!, lookId2: ID!): LookComparison!

  # Cue Lists
  cueLists(projectId: ID!): [CueListSummary!]!
  cueList(
    id: ID!
    page: Int = 1
    perPage: Int = 50
    includeLookDetails: Boolean = false
  ): CueList
  cueListPlaybackStatus(cueListId: ID!): CueListPlaybackStatus
  "Get global playback status - which cue list is currently playing (if any)"
  globalPlaybackStatus: GlobalPlaybackStatus!
  """
  Get all cues in a cue list with their look info, plus orphan looks.
  Used for the "Copy Fixtures to Other Looks" modal.
  """
  cuesWithLookInfo(cueListId: ID!): CuesWithLookInfoResponse!

  # Cues
  cue(id: ID!): Cue

  searchCues(
    cueListId: ID!
    query: String!
    page: Int = 1
    perPage: Int = 50
  ): CuePage!

  # DMX Output
  dmxOutput(universe: Int!): [Int!]!
  allDmxOutput: [UniverseOutput!]!

  # Preview System
  previewSession(sessionId: ID!): PreviewSession

  # Active Look Tracking
  currentActiveLook: Look

  # Settings
  settings: [Setting!]!
  setting(key: String!): Setting

  # System Information
  systemInfo: SystemInfo!
  artNetStatus: ArtNetStatus!
  networkInterfaceOptions: [NetworkInterfaceOption!]!

  # WiFi Configuration
  wifiNetworks(rescan: Boolean = true, deduplicate: Boolean = true): [WiFiNetwork!]!
  wifiStatus: WiFiStatus!
  savedWifiNetworks: [WiFiNetwork!]!
  wifiMode: WiFiMode!
  apConfig: APConfig
  apClients: [APClient!]!

  # QLC+ Fixture Mapping Suggestions (read-only)
  getQLCFixtureMappingSuggestions(projectId: ID!): QLCFixtureMappingResult!

  # Version Management
  systemVersions: SystemVersionInfo!
  availableVersions(repository: String!): [String!]!
  "Get server build information for version verification"
  buildInfo: BuildInfo!

  # Open Fixture Library
  "Get the current status of any ongoing OFL import"
  oflImportStatus: OFLImportStatus!
  "Check for available OFL updates without importing"
  checkOFLUpdates: OFLUpdateCheckResult!

  # Effects
  "Get a single effect by ID"
  effect(id: ID!): Effect
  "List all effects in a project"
  effects(projectId: ID!): [Effect!]!
  "Get the current status of the modulator engine"
  modulatorStatus: ModulatorStatus!

  # Bulk Read Queries
  fixturesByIds(ids: [ID!]!): [FixtureInstance!]!
  looksByIds(ids: [ID!]!): [Look!]!
  cuesByIds(ids: [ID!]!): [Cue!]!
  cueListsByIds(ids: [ID!]!): [CueList!]!
  lookBoardsByIds(ids: [ID!]!): [LookBoard!]!
  fixtureDefinitionsByIds(ids: [ID!]!): [FixtureDefinition!]!
  projectsByIds(ids: [ID!]!): [Project!]!

  # Undo/Redo
  "Get current undo/redo status for a project"
  undoRedoStatus(projectId: ID!): UndoRedoStatus!
  "Get paginated operation history for a project"
  operationHistory(projectId: ID!, page: Int = 1, perPage: Int = 50): OperationHistoryPage!
  "Get a specific operation by ID"
  operation(operationId: ID!): Operation
}

# =============================================================================
# MUTATIONS
# =============================================================================

type Mutation {
  # Authentication
  "Register a new user with email and password"
  register(input: RegisterInput!): AuthPayload!
  "Login with email and password"
  login(email: String!, password: String!): AuthPayload!
  "Logout the current session"
  logout: Boolean!
  "Logout all sessions for the current user"
  logoutAll: Boolean!
  "Refresh the access token using a refresh token"
  refreshToken(refreshToken: String!): AuthPayload!
  "Change the current user's password"
  changePassword(oldPassword: String!, newPassword: String!): Boolean!
  "Request a password reset email"
  requestPasswordReset(email: String!): Boolean!
  "Reset password using a reset token"
  resetPassword(token: String!, newPassword: String!): Boolean!
  "Request email verification"
  requestEmailVerification: Boolean!
  "Verify email with token"
  verifyEmail(token: String!): Boolean!

  # OAuth Authentication
  "Sign in with Apple"
  appleSignIn(identityToken: String!, authorizationCode: String!): AuthPayload!

  # Device Authentication
  "Register a device for device-based auth (unauthenticated)"
  registerDevice(fingerprint: String!, name: String!): DeviceRegistrationResult!
  "Authorize a device using an authorization code"
  authorizeDevice(fingerprint: String!, authorizationCode: String!): AuthPayload!

  # User Management (admin only)
  "Create a new user (admin only)"
  createUser(input: CreateUserInput!): User!
  "Update a user (admin only)"
  updateUser(id: ID!, input: UpdateUserInput!): User!
  "Delete a user (admin only)"
  deleteUser(id: ID!): Boolean!
  "Create a user group (admin only)"
  createUserGroup(input: CreateUserGroupInput!): UserGroup!
  "Update a user group (admin only)"
  updateUserGroup(id: ID!, input: UpdateUserGroupInput!): UserGroup!
  "Delete a user group (admin only)"
  deleteUserGroup(id: ID!): Boolean!
  "Add a user to a group (group admin or system admin)"
  addUserToGroup(userId: ID!, groupId: ID!, role: GroupMemberRole = MEMBER): Boolean!
  "Remove a user from a group (group admin or system admin)"
  removeUserFromGroup(userId: ID!, groupId: ID!): Boolean!
  "Update a group member's role (group admin or system admin)"
  updateGroupMemberRole(userId: ID!, groupId: ID!, role: GroupMemberRole!): Boolean!
  "Invite a user by email to join a group"
  inviteToGroup(groupId: ID!, email: String!, role: GroupMemberRole = MEMBER): GroupInvitation!
  "Accept a group invitation"
  acceptInvitation(invitationId: ID!): Boolean!
  "Decline a group invitation"
  declineInvitation(invitationId: ID!): Boolean!
  "Cancel a pending group invitation (group admin or system admin)"
  cancelInvitation(invitationId: ID!): Boolean!
  "Add a device to a group (group admin or system admin)"
  addDeviceToGroup(deviceId: ID!, groupId: ID!): Boolean!
  "Remove a device from a group (group admin or system admin)"
  removeDeviceFromGroup(deviceId: ID!, groupId: ID!): Boolean!

  # Device Management (admin only)
  "Create a device authorization code (admin only)"
  createDeviceAuthCode(deviceId: ID!): DeviceAuthCode!
  "Approve a pending device (admin only). Optionally assign to a group and/or set the default user."
  approveDevice(deviceId: ID!, permissions: DevicePermissions!, groupId: ID, defaultUserId: ID): Device!
  "Update a device (admin only)"
  updateDevice(id: ID!, input: UpdateDeviceInput!): Device!
  "Update device permissions (admin only)"
  updateDevicePermissions(deviceId: ID!, permissions: DevicePermissions!): Device!
  "Revoke a device's authorization (admin only)"
  revokeDevice(id: ID!): Device!

  # Session Management (admin only)
  "Revoke a specific session (admin only)"
  revokeSession(sessionId: ID!): Boolean!
  "Revoke all sessions for a user (admin only)"
  revokeAllUserSessions(userId: ID!): Boolean!

  # Auth Settings (admin only)
  "Update authentication settings (admin only)"
  updateAuthSettings(input: UpdateAuthSettingsInput!): AuthSettings!

  # Project Management
  createProject(input: CreateProjectInput!): Project!
  updateProject(id: ID!, input: CreateProjectInput!): Project!
  deleteProject(id: ID!): Boolean!  # Soft delete - project can be restored
  restoreProject(id: ID!): Project!  # Restore a soft-deleted project
  permanentlyDeleteProject(id: ID!): Boolean!  # Permanently delete (cannot be restored)
  bulkCreateProjects(input: BulkProjectCreateInput!): [Project!]!
  bulkUpdateProjects(input: BulkProjectUpdateInput!): [Project!]!
  bulkDeleteProjects(projectIds: [ID!]!): BulkDeleteResult!

  # Fixture Definitions
  createFixtureDefinition(
    input: CreateFixtureDefinitionInput!
  ): FixtureDefinition!
  importOFLFixture(input: ImportOFLFixtureInput!): FixtureDefinition!
  updateFixtureDefinition(
    id: ID!
    input: CreateFixtureDefinitionInput!
  ): FixtureDefinition!
  deleteFixtureDefinition(id: ID!): Boolean!
  bulkCreateFixtureDefinitions(input: BulkFixtureDefinitionCreateInput!): [FixtureDefinition!]!
  bulkUpdateFixtureDefinitions(input: BulkFixtureDefinitionUpdateInput!): [FixtureDefinition!]!
  bulkDeleteFixtureDefinitions(definitionIds: [ID!]!): BulkDeleteResult!

  # Fixture Instances
  createFixtureInstance(input: CreateFixtureInstanceInput!): FixtureInstance!
  updateFixtureInstance(
    id: ID!
    input: UpdateFixtureInstanceInput!
  ): FixtureInstance!
  bulkUpdateFixtures(input: BulkFixtureUpdateInput!): [FixtureInstance!]!
  bulkCreateFixtures(input: BulkFixtureCreateInput!): [FixtureInstance!]!
  deleteFixtureInstance(id: ID!): Boolean!
  bulkDeleteFixtures(fixtureIds: [ID!]!): BulkDeleteResult!

  # Instance Channel Updates
  updateInstanceChannelFadeBehavior(
    channelId: ID!
    fadeBehavior: FadeBehavior!
  ): InstanceChannel!
  bulkUpdateInstanceChannelsFadeBehavior(
    updates: [ChannelFadeBehaviorInput!]!
  ): [InstanceChannel!]!

  # Fixture Ordering
  reorderProjectFixtures(
    projectId: ID!
    fixtureOrders: [FixtureOrderInput!]!
  ): Boolean!
  reorderLookFixtures(
    lookId: ID!
    fixtureOrders: [FixtureOrderInput!]!
  ): Boolean!

  # Fixture Layout Positions
  updateFixturePositions(positions: [FixturePositionInput!]!): Boolean!

  # Looks
  createLook(input: CreateLookInput!): Look!
  updateLook(id: ID!, input: UpdateLookInput!): Look!
  duplicateLook(id: ID!): Look!
  cloneLook(lookId: ID!, newName: String!): Look!
  deleteLook(id: ID!): Boolean!
  bulkCreateLooks(input: BulkLookCreateInput!): [Look!]!
  bulkUpdateLooks(input: BulkLookUpdateInput!): [Look!]!
  bulkDeleteLooks(lookIds: [ID!]!): BulkDeleteResult!

  # Safe Look Updates (Additive)
  addFixturesToLook(
    lookId: ID!
    fixtureValues: [FixtureValueInput!]!
    overwriteExisting: Boolean = false
  ): Look!
  removeFixturesFromLook(lookId: ID!, fixtureIds: [ID!]!): Look!
  updateLookPartial(
    lookId: ID!
    name: String
    description: String
    fixtureValues: [FixtureValueInput!]
    mergeFixtures: Boolean = true
  ): Look!
  bulkUpdateLooksPartial(input: BulkLookPartialUpdateInput!): [Look!]!
  """
  Copy fixture values from one look to multiple target looks.
  This is an atomic operation - a single undo reverses all changes.
  """
  copyFixturesToLooks(input: CopyFixturesToLooksInput!): CopyFixturesToLooksResult!

  # Look Boards
  createLookBoard(input: CreateLookBoardInput!): LookBoard!
  updateLookBoard(id: ID!, input: UpdateLookBoardInput!): LookBoard!
  deleteLookBoard(id: ID!): Boolean!
  bulkCreateLookBoards(input: BulkLookBoardCreateInput!): [LookBoard!]!
  bulkUpdateLookBoards(input: BulkLookBoardUpdateInput!): [LookBoard!]!
  bulkDeleteLookBoards(lookBoardIds: [ID!]!): BulkDeleteResult!

  # Look Board Buttons
  addLookToBoard(input: CreateLookBoardButtonInput!): LookBoardButton!
  updateLookBoardButton(
    id: ID!
    input: UpdateLookBoardButtonInput!
  ): LookBoardButton!
  removeLookFromBoard(buttonId: ID!): Boolean!
  updateLookBoardButtonPositions(
    positions: [LookBoardButtonPositionInput!]!
  ): Boolean!
  bulkCreateLookBoardButtons(input: BulkLookBoardButtonCreateInput!): [LookBoardButton!]!
  bulkUpdateLookBoardButtons(input: BulkLookBoardButtonUpdateInput!): [LookBoardButton!]!
  bulkDeleteLookBoardButtons(buttonIds: [ID!]!): BulkDeleteResult!

  # Look Board Playback (activates look with board's fade time)
  activateLookFromBoard(
    lookBoardId: ID!
    lookId: ID!
    fadeTimeOverride: Float
  ): Boolean!

  # Cue Lists
  createCueList(input: CreateCueListInput!): CueList!
  updateCueList(id: ID!, input: CreateCueListInput!): CueList!
  deleteCueList(id: ID!): Boolean!
  bulkCreateCueLists(input: BulkCueListCreateInput!): [CueList!]!
  bulkUpdateCueLists(input: BulkCueListUpdateInput!): [CueList!]!
  bulkDeleteCueLists(cueListIds: [ID!]!): BulkDeleteResult!

  # Cues
  createCue(input: CreateCueInput!): Cue!
  updateCue(id: ID!, input: CreateCueInput!): Cue!
  deleteCue(id: ID!): Boolean!
  reorderCues(cueListId: ID!, cueOrders: [CueOrderInput!]!): Boolean!
  bulkCreateCues(input: BulkCueCreateInput!): [Cue!]!
  bulkUpdateCues(input: BulkCueUpdateInput!): [Cue!]!
  bulkDeleteCues(cueIds: [ID!]!): BulkDeleteResult!
  "Toggle the skip status of a cue (skip=true means the cue is bypassed during playback)"
  toggleCueSkip(cueId: ID!): Cue!

  # Preview System
  startPreviewSession(projectId: ID!): PreviewSession!
  commitPreviewSession(sessionId: ID!): Boolean!
  cancelPreviewSession(sessionId: ID!): Boolean!
  updatePreviewChannel(
    sessionId: ID!
    fixtureId: ID!
    channelIndex: Int!
    value: Int!
  ): Boolean!
  updatePreviewChannels(
    sessionId: ID!
    updates: [PreviewChannelUpdateInput!]!
  ): Boolean!
  initializePreviewWithLook(sessionId: ID!, lookId: ID!): Boolean!

  # DMX Control
  setChannelValue(universe: Int!, channel: Int!, value: Int!): Boolean!
  setLookLive(lookId: ID!): Boolean!
  playCue(cueId: ID!, fadeInTime: Float): Boolean!
  fadeToBlack(fadeOutTime: Float!): Boolean!

  # Cue List Playback Control
  startCueList(cueListId: ID!, startFromCue: Int, fadeInTime: Float): Boolean!
  nextCue(cueListId: ID!, fadeInTime: Float): Boolean!
  previousCue(cueListId: ID!, fadeInTime: Float): Boolean!
  goToCue(cueListId: ID!, cueIndex: Int!, fadeInTime: Float): Boolean!
  stopCueList(cueListId: ID!): Boolean!
  "Resume a paused cue list by snapping to the current cue's look values instantly"
  resumeCueList(cueListId: ID!): Boolean!

  # Native LacyLights Import/Export
  exportProject(projectId: ID!, options: ExportOptionsInput): ExportResult!
  importProject(jsonContent: String!, options: ImportOptionsInput!): ImportResult!

  # QLC+ Import/Export (data-modifying operations)
  importProjectFromQLC(
    xmlContent: String!
    originalFileName: String!
  ): QLCImportResult!
  exportProjectToQLC(
    projectId: ID!
    fixtureMappings: [FixtureMappingInput!]
  ): QLCExportResult!

  # ETC Eos ASCII Import/Export
  importProjectFromEos(
    asciiContent: String!
    options: EosImportOptionsInput
  ): EosImportResult!
  exportProjectToEos(projectId: ID!): EosExportResult!

  # Settings
  updateSetting(input: UpdateSettingInput!): Setting!
  updateFadeUpdateRate(rateHz: Int!): Boolean!

  # Art-Net Control
  setArtNetEnabled(enabled: Boolean!, fadeTime: Float): ArtNetStatus!

  # WiFi Configuration
  connectWiFi(ssid: String!, password: String): WiFiConnectionResult!
  disconnectWiFi: WiFiConnectionResult!
  setWiFiEnabled(enabled: Boolean!): WiFiStatus!
  forgetWiFiNetwork(ssid: String!): Boolean!
  startAPMode: WiFiModeResult!
  stopAPMode(connectToSSID: String): WiFiModeResult!
  resetAPTimeout: Boolean!

  # Version Management
  updateRepository(repository: String!, version: String): UpdateResult!
  updateAllRepositories: [UpdateResult!]!

  # Open Fixture Library
  "Trigger an OFL import/update operation"
  triggerOFLImport(options: OFLImportOptionsInput): OFLImportResult!
  "Cancel an ongoing OFL import"
  cancelOFLImport: Boolean!

  # Effect Management
  "Create a new effect"
  createEffect(input: CreateEffectInput!): Effect!
  "Update an existing effect"
  updateEffect(id: ID!, input: UpdateEffectInput!): Effect!
  "Delete an effect"
  deleteEffect(id: ID!): Boolean!

  # Effect-Fixture Association
  "Add a fixture to an effect with optional per-fixture settings"
  addFixtureToEffect(input: AddFixtureToEffectInput!): EffectFixture!
  "Remove a fixture from an effect"
  removeFixtureFromEffect(effectId: ID!, fixtureId: ID!): Boolean!
  "Update fixture-specific settings in an effect"
  updateEffectFixture(id: ID!, input: UpdateEffectFixtureInput!): EffectFixture!

  # Effect Channel Management
  "Add a channel to an effect fixture"
  addChannelToEffectFixture(effectFixtureId: ID!, input: EffectChannelInput!): EffectChannel!
  "Update an effect channel"
  updateEffectChannel(id: ID!, input: EffectChannelInput!): EffectChannel!
  "Remove a channel from an effect fixture"
  removeChannelFromEffectFixture(id: ID!): Boolean!

  # Effect-Cue Association
  "Add an effect to a cue with runtime parameters"
  addEffectToCue(input: AddEffectToCueInput!): CueEffect!
  "Remove an effect from a cue"
  removeEffectFromCue(cueId: ID!, effectId: ID!): Boolean!

  # Effect Playback Controls
  "Activate an effect with optional fade time"
  activateEffect(effectId: ID!, fadeTime: Float): Boolean!
  "Stop an active effect with optional fade time"
  stopEffect(effectId: ID!, fadeTime: Float): Boolean!

  # System Effect Controls
  "Activate the system blackout with optional fade time"
  activateBlackout(fadeTime: Float): Boolean!
  "Release the system blackout with optional fade time"
  releaseBlackout(fadeTime: Float): Boolean!
  "Set the grand master level (0.0-1.0)"
  setGrandMaster(value: Float!): Boolean!

  # Undo/Redo Operations
  "Undo the last operation for a project"
  undo(projectId: ID!): UndoRedoResult!
  "Redo the last undone operation for a project"
  redo(projectId: ID!): UndoRedoResult!
  "Jump to a specific operation in history"
  jumpToOperation(projectId: ID!, operationId: ID!): UndoRedoResult!
  "Clear all operation history for a project"
  clearOperationHistory(projectId: ID!, confirmClear: Boolean!): Boolean!
}

# =============================================================================
# SUBSCRIPTIONS
# =============================================================================

type Subscription {
  dmxOutputChanged(universe: Int): UniverseOutput!
  projectUpdated(projectId: ID!): Project!
  previewSessionUpdated(projectId: ID!): PreviewSession!
  cueListPlaybackUpdated(cueListId: ID!): CueListPlaybackStatus!
  "Real-time updates when cue list data changes (cue added/updated/removed, reordering, metadata changes, look name changes)"
  cueListDataChanged(cueListId: ID!): CueListDataChangedPayload!
  "Global playback status updates - triggered when any cue list starts/stops/changes cue"
  globalPlaybackStatusUpdated: GlobalPlaybackStatus!
  systemInfoUpdated: SystemInfo!
  wifiStatusUpdated: WiFiStatus!
  wifiModeChanged: WiFiMode!
  "Real-time updates during OFL import"
  oflImportProgress: OFLImportStatus!
  "Real-time updates when operation history changes (after undo/redo or new operations)"
  operationHistoryChanged(projectId: ID!): UndoRedoStatus!
  "Real-time updates when look data changes (created, updated, deleted via undo/redo)"
  lookDataChanged(projectId: ID!): LookDataChangedPayload!
  "Real-time updates when look board data changes (created, updated, deleted via undo/redo)"
  lookBoardDataChanged(projectId: ID!): LookBoardDataChangedPayload!
  "Real-time updates when fixture data changes (positions updated via undo/redo)"
  fixtureDataChanged(projectId: ID!): FixtureDataChangedPayload!
}
