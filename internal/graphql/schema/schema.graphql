  createdAt: String!
  updatedAt: String!
  deletedAt: String  # Soft delete timestamp - null means not deleted
  fixtures: [FixtureInstance!]!
  looks: [Look!]!
  cueLists: [CueList!]!
  lookBoards: [LookBoard!]!
  users: [ProjectUser!]!

  # 2D Layout Canvas Configuration (for fixture layout editor)
  layoutCanvasWidth: Int!
  layoutCanvasHeight: Int!
}

type FixtureDefinition {
  id: ID!
  manufacturer: String!
  model: String!
  type: FixtureType!
  channels: [ChannelDefinition!]!
  modes: [FixtureMode!]!
  isBuiltIn: Boolean!
  createdAt: String!
}

type FixtureMode {
  id: ID!
  name: String!
  shortName: String
  channelCount: Int!
  channels: [ModeChannel!]!
}

type ModeChannel {
  id: ID!
  offset: Int!
  channel: ChannelDefinition!
}

type ChannelDefinition {
  id: ID!
  name: String!
  type: ChannelType!
  offset: Int!
  minValue: Int!
  maxValue: Int!
  defaultValue: Int!
  fadeBehavior: FadeBehavior!
  isDiscrete: Boolean!
}

type FixtureInstance {
  id: ID!
  name: String!
  description: String

  # Fixture Definition Info (flattened)
  definitionId: ID!
  manufacturer: String!
  model: String!
  type: FixtureType!

  # Mode Info (flattened)
  modeName: String!
  channelCount: Int!
  channels: [InstanceChannel!]!

  # DMX Configuration
  project: Project!
  universe: Int!
  startChannel: Int!
  tags: [String!]!
  projectOrder: Int

  # 2D Layout Position.
  # These fields are exposed in query responses as pixel coordinates
  # (0 to project canvasWidth/Height). During the migration period,
  # stored values may still be in normalized 0-1 coordinates, but are
  # transparently converted to pixels in API responses for backward
  # compatibility. New values should always be provided in pixels.
  layoutX: Float
  layoutY: Float
  layoutRotation: Float

  createdAt: String!
}

type InstanceChannel {
  id: ID!
  offset: Int!
  name: String!
  type: ChannelType!
  minValue: Int!
  maxValue: Int!
  defaultValue: Int!
  fadeBehavior: FadeBehavior!
  isDiscrete: Boolean!
}

type Look {
  id: ID!
  name: String!
  description: String
  project: Project!
  fixtureValues: [FixtureValue!]!
  createdAt: String!
  updatedAt: String!
}

type ChannelValue {
  offset: Int!
  value: Int!
}

type FixtureValue {
  id: ID!
